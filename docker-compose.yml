# Sets up PostgreSQL database with pgVector extension
version: '3.8'

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: medical_rag_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medical_rag
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: